<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Madshare — cmus view</title>
  <meta name="api-url" content="{{.APIURL}}">
  <link rel="stylesheet" href="/static/css/cmus.css">
</head>
<body>

<div class="library-layout">

  <!-- Temporary: cmus view is paused -->
  <div class="cmus-paused-banner" role="status">
    <strong>This view is temporarily unavailable.</strong>
    The cmus-style player is paused for now — we'll be back.
    <a href="/">Go to Library →</a>
  </div>

  <!-- Header -->
  <header class="library-header">
    <span class="logo"><span>Mad</span>share</span>
    <nav class="main-nav" aria-label="Site navigation">
      <a href="/" class="nav-link">Library</a>
      <a href="/cmus" class="nav-link nav-link--active" aria-current="page">cmus</a>
      <a href="/admin" class="nav-link">Admin</a>
      <a href="/source" class="nav-link" download>Source</a>
    </nav>
  </header>

  <!-- Artists column -->
  <section class="library-col" id="col-artists" aria-label="Artists">
    <div class="col-header">
      <span class="col-label">Artists</span>
      <span class="col-count" id="artists-count"></span>
    </div>
    <div class="col-scroll" id="artists-list" role="listbox" aria-label="Artists" tabindex="0">
      <!-- Populated by JS -->
    </div>
  </section>

  <!-- Albums column -->
  <section class="library-col" id="col-albums" aria-label="Albums">
    <div class="col-header">
      <span class="col-label">Albums</span>
      <span class="col-count" id="albums-count"></span>
    </div>
    <div class="col-scroll" id="albums-list" role="listbox" aria-label="Albums" tabindex="0">
      <div class="col-empty-state" id="albums-empty">Select an artist</div>
    </div>
  </section>

  <!-- Tracks column -->
  <section class="library-col" id="col-tracks" aria-label="Tracks">
    <div class="col-header">
      <span class="col-label">Tracks</span>
      <span class="col-count" id="tracks-count"></span>
    </div>
    <div class="col-scroll" id="tracks-list" role="listbox" aria-label="Tracks" tabindex="0">
      <div class="col-empty-state" id="tracks-empty">Select an album</div>
    </div>
  </section>

  <!-- Player bar -->
  <footer class="library-player" id="player-bar" aria-label="Now playing">
    <div class="player-art" id="player-art" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
      </svg>
    </div>

    <div class="player-info">
      <div class="player-title" id="player-title">Nothing playing</div>
      <div class="player-artist" id="player-artist"></div>
    </div>

    <div class="player-controls-wrap" id="player-controls" aria-disabled="true">
      <button class="player-btn player-btn--sm" id="btn-prev" aria-label="Previous" title="Previous">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>
        </svg>
      </button>
      <button class="player-btn player-btn--primary" id="btn-play" aria-label="Play" title="Play">
        <svg id="icon-play" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M8 5v14l11-7z"/>
        </svg>
        <svg id="icon-pause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="display:none">
          <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
        </svg>
      </button>
      <button class="player-btn player-btn--sm" id="btn-next" aria-label="Next" title="Next">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
        </svg>
      </button>
    </div>

    <div class="player-scrubber-wrap" id="player-scrubber-wrap">
      <input type="range" class="player-scrubber" id="scrubber"
             min="0" max="1" step="0.001" value="0"
             aria-label="Playback position">
      <span class="player-time" id="player-time" aria-live="off">0:00 / 0:00</span>
    </div>

    <div class="player-volume-wrap" id="player-volume-wrap">
      <button class="player-vol-icon" id="btn-mute" aria-label="Mute" title="Mute">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
      </button>
      <input type="range" class="player-volume" id="volume-slider"
             min="0" max="1" step="0.02" value="1"
             aria-label="Volume">
    </div>
  </footer>

</div><!-- /.library-layout -->

<!-- Hidden file inputs for image uploads -->
<input type="file" id="artist-image-input" accept="image/jpeg,image/png,image/webp" style="display:none" aria-hidden="true">
<input type="file" id="album-image-input"  accept="image/jpeg,image/png,image/webp" style="display:none" aria-hidden="true">

<audio id="audio" preload="auto"></audio>

<script type="module" src="/static/js/cmus.js"></script>
</body>
</html>
