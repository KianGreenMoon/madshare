<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Madshare &mdash; Admin &middot; Trash</title>
  <meta name="api-url" content="{{.APIURL}}">
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/admin-shell.css">
  <link rel="stylesheet" href="/static/css/file-view.css">
  <link rel="stylesheet" href="/static/css/player.css">
</head>
<body>

{{template "header" .}}
{{template "admin-shell" .}}

<main class="admin-main">
  <!-- The shared file-management component (file-list.js) renders the whole
       Trash surface here: heading, filter, bulk toolbar, table, preview Play,
       and per-file metadata Edit. -->
  <section aria-label="Trash">
    <div id="fileList" aria-busy="true" aria-live="polite"></div>
  </section>
</main>

<!-- Permanent-delete confirm (bulk) -->
<div class="modal-backdrop hidden" id="trashDeleteModal" role="dialog" aria-modal="true" aria-labelledby="trashDeleteTitle">
  <div class="modal">
    <div class="modal-header">
      <h2 id="trashDeleteTitle">Delete forever</h2>
      <button class="btn-close" id="trashDeleteClose" aria-label="Close">&times;</button>
    </div>
    <p class="modal-body" id="trashDeleteBody"></p>
    <p class="modal-body modal-danger">This removes the blobs and all records — it cannot be undone.</p>
    <p class="login-error" id="trashDeleteError" role="alert" hidden></p>
    <div class="modal-actions">
      <button type="button" class="btn btn-neutral" id="trashDeleteCancel">Cancel</button>
      <button type="button" class="btn btn-destructive-solid" id="trashDeleteConfirm">Delete forever</button>
    </div>
  </div>
</div>

{{template "player-bar" .}}
{{template "auth-modals" .}}

<script type="module" src="/static/js/admin/trash.js"></script>
</body>
</html>
