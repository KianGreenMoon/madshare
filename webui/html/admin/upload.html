<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Madshare &mdash; Admin &middot; Upload</title>
  <meta name="api-url" content="{{.APIURL}}">
  <!-- Same upload body as /upload, wrapped in the admin shell. CSS is the union
       of what both shells need: admin-shell chrome + the upload layout + the
       file-view component (self-sufficient) + player.css for the page-local
       preview player. See docs/plans/cross-shell-upload.md. -->
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/admin-shell.css">
  <link rel="stylesheet" href="/static/css/upload.css">
  <link rel="stylesheet" href="/static/css/file-view.css">
  <link rel="stylesheet" href="/static/css/player.css">
</head>
<body>

{{template "header" .}}
{{template "admin-shell" .}}

<main class="upload-main">{{template "upload-main" .}}</main>

{{template "player-bar" .}}
{{template "auth-modals" .}}

<script type="module" src="/static/js/admin/upload.js"></script>
</body>
</html>
