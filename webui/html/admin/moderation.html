<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Madshare &mdash; Admin &middot; Moderation</title>
  <meta name="api-url" content="{{.APIURL}}">
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/admin-shell.css">
  <link rel="stylesheet" href="/static/css/admin-moderation.css">
  <link rel="stylesheet" href="/static/css/file-view.css">
  <link rel="stylesheet" href="/static/css/player.css">
</head>
<body>

{{template "header" .}}
{{template "admin-shell" .}}

<main class="admin-main">
  <!-- The shared file-management component (file-list.js) renders the queue:
       heading, filter, bulk toolbar, per-uploader collapsible groups, the
       review-state badges, preview Play, and per-file Edit. -->
  <section aria-label="Moderation">
    <div id="fileList" aria-busy="true" aria-live="polite"></div>
  </section>
</main>

<!-- Return-with-note modal (single file or a selected batch, one note) -->
<div class="modal-backdrop hidden" id="returnModal" role="dialog" aria-modal="true" aria-labelledby="returnTitle">
  <div class="modal">
    <div class="modal-header">
      <h2 id="returnTitle">Return to uploader</h2>
      <button class="btn-close" id="returnClose" aria-label="Close">&times;</button>
    </div>
    <form class="edit-form" id="returnForm">
      <p class="modal-body" id="returnBody"></p>
      <label>Note to the uploader
        <textarea id="returnNote" rows="3" maxlength="1000" required
                  placeholder="What should be fixed before resubmitting?"></textarea>
      </label>
      <p class="login-error" id="returnError" role="alert" hidden></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-neutral" id="returnCancel">Cancel</button>
        <button type="submit" class="btn btn-neutral" id="returnConfirm">Return</button>
      </div>
    </form>
  </div>
</div>

<!-- Discard confirm (bulk; single rows confirm inline) -->
<div class="modal-backdrop hidden" id="discardModal" role="dialog" aria-modal="true" aria-labelledby="discardTitle">
  <div class="modal">
    <div class="modal-header">
      <h2 id="discardTitle">Discard to Trash</h2>
      <button class="btn-close" id="discardClose" aria-label="Close">&times;</button>
    </div>
    <p class="modal-body" id="discardBody"></p>
    <p class="modal-body modal-danger">Discarded files move to Trash — restoring them returns them to this queue.</p>
    <p class="login-error" id="discardError" role="alert" hidden></p>
    <div class="modal-actions">
      <button type="button" class="btn btn-neutral" id="discardCancel">Cancel</button>
      <button type="button" class="btn btn-destructive-solid" id="discardConfirm">Discard</button>
    </div>
  </div>
</div>

{{template "player-bar" .}}
{{template "auth-modals" .}}

<script type="module" src="/static/js/admin/moderation.js"></script>
</body>
</html>
