{{define "header-insert"}}
  <div class="header__search">
    <svg class="header__search-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
    </svg>
    <input
      class="header__search-input"
      type="search"
      placeholder="Search artists, albums, tracks…"
      aria-label="Search library"
      autocomplete="off"
      spellcheck="false"
    >
    <button class="header__search-clear" aria-label="Clear search" style="display:none">&times;</button>
  </div>
{{end}}

<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Madshare</title>
  <meta name="api-url" content="{{.APIURL}}">
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/player.css">
</head>
<body data-page="library" data-module="/static/js/app.js">

{{template "header" .}}

<main>
  <div class="view-panel view-panel--active" id="view-library">
    <div class="library-bar">
      <nav class="breadcrumb" id="breadcrumb" aria-label="Library navigation">
        <!-- populated by JS -->
      </nav>
    </div>
    <div class="library-panel" id="libraryPanel" aria-live="polite">
      <!-- populated by JS: artists / albums / tracks -->
    </div>
  </div>
  <div class="view-panel view-panel--hidden" id="view-search" aria-live="polite">
    <!-- search results rendered here by JS -->
  </div>
</main>

{{template "player-bar" .}}

<!-- Upload modal (drag-and-drop from the library page) -->
<div class="modal-backdrop hidden" id="uploadModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Upload Music</h2>
      <button class="btn-close" id="closeModal" aria-label="Close">&times;</button>
    </div>
    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept="audio/*" aria-label="Choose audio file">
      <div class="drop-icon">&#9835;</div>
      <p>Drop an audio file here</p>
      <small>or click to browse &mdash; MP3, FLAC, OGG, WAV</small>
    </div>
    <div class="upload-status" id="uploadStatus" aria-live="polite"></div>
  </div>
</div>

{{template "auth-modals" .}}

<script type="module" src="/static/js/shell.js"></script>
</body>
</html>
