<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nodes &mdash; Madshare</title>
  <meta name="api-url" content="{{.APIURL}}">
  {{template "theme-guard" .}}
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/player.css">
  <link rel="stylesheet" href="/static/css/madnetwork.css">
</head>
<body data-page="madnetwork-nodes" data-section="madnetwork" data-module="/static/js/madnetwork-nodes.js">

{{template "header" .}}

<main>
  {{template "madnetwork-subnav" .}}

  <!-- The libraries behind the merged catalog, ordered by friendship hops.
       Populated by JS; every row links to that node's own page. -->
  <div class="mn-status" id="mnStatus" hidden></div>

  <div class="library-search">
    <svg class="library-search__icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
    </svg>
    <input
      class="library-search__input"
      id="mnNodeFilter"
      type="search"
      placeholder="Filter nodes by name or key…"
      aria-label="Filter nodes"
      autocomplete="off"
      spellcheck="false">
    <button class="library-search__clear" aria-label="Clear filter" style="display:none">&times;</button>
  </div>

  <div class="view-panel view-panel--active">
    <div class="library-panel" id="mnNodeList" aria-live="polite">
      <!-- populated by JS: one row per node -->
    </div>
  </div>
</main>

{{template "player-bar" .}}
{{template "auth-modals" .}}

<script type="module" src="/static/js/shell.js"></script>
</body>
</html>
