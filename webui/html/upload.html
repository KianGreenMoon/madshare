<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Madshare</title>
  <style>
    /* ── Themes ── */
    :root[data-theme="dark"] {
      --bg:            #0d0d10;
      --surface:       #16161c;
      --surface-hover: #1e1e28;
      --text:          #e2e2ea;
      --text-muted:    #9090a8;   /* 6:1 on surface — WCAG AA */
      --accent:        #7b68ee;
      --accent-dim:    #5548c8;
      --accent-glow:   rgba(123,104,238,0.15);
      --border:        #252530;
      --error:         #e05c5c;
      --success:       #5cb870;
      --range-track:   #35354a;   /* lifted so bar is visible at rest */
    }
    :root[data-theme="light"] {
      --bg:            #f5f5f7;
      --surface:       #ffffff;
      --surface-hover: #ededf5;
      --text:          #1a1a2e;
      --text-muted:    #656580;   /* 5.6:1 on white — WCAG AA */
      --accent:        #6c5ce7;
      --accent-dim:    #5048c0;
      --accent-glow:   rgba(108,92,231,0.12);
      --border:        #dedee8;
      --error:         #d63031;
      --success:       #00b894;
      --range-track:   #c0c0d0;
    }
    :root[data-theme="ocean"] {
      --bg:            #0a1628;
      --surface:       #0f2040;
      --surface-hover: #162a50;
      --text:          #c8e6f5;
      --text-muted:    #5d9ab8;   /* 5.3:1 on surface — WCAG AA */
      --accent:        #00cec9;
      --accent-dim:    #00a8a4;
      --accent-glow:   rgba(0,206,201,0.12);
      --border:        #1a3050;
      --error:         #ff7675;
      --success:       #55efc4;
      --range-track:   #2a4060;
    }
    :root[data-theme="sunset"] {
      --bg:            #1a0a10;
      --surface:       #26101a;
      --surface-hover: #321525;
      --text:          #f5e0d0;
      --text-muted:    #c09080;   /* 6.5:1 on surface — WCAG AA */
      --accent:        #fd7c6e;
      --accent-dim:    #e05a4e;
      --accent-glow:   rgba(253,124,110,0.12);
      --border:        #3a1820;
      --error:         #ff4757;
      --success:       #7bed9f;
      --range-track:   #4a2530;
    }

    :root {
      --space-1: 4px;  --space-2: 8px;  --space-3: 12px;
      --space-4: 16px; --space-5: 24px; --space-6: 32px;
      --radius: 8px;
      --player-h: 84px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: calc(var(--player-h) + var(--space-4));
    }

    /* ── Header ── */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-4) var(--space-5);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .logo span { color: var(--accent); }   /* accent on "Mad" — the differentiator */

    .header-actions {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    .theme-switcher {
      display: flex;
      gap: 3px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px;
    }

    .theme-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 120ms ease, border-color 120ms ease;
    }
    .theme-dot:hover { transform: scale(1.15); }
    .theme-dot[data-theme="dark"]   { background: linear-gradient(135deg, #0d0d10 50%, #7b68ee 50%); }
    .theme-dot[data-theme="light"]  { background: linear-gradient(135deg, #f5f5f7 50%, #6c5ce7 50%); }
    .theme-dot[data-theme="ocean"]  { background: linear-gradient(135deg, #0a1628 50%, #00cec9 50%); }
    .theme-dot[data-theme="sunset"] { background: linear-gradient(135deg, #1a0a10 50%, #fd7c6e 50%); }
    .theme-dot.active { border-color: var(--accent); }
    .theme-dot:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .btn-upload {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-4);
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 150ms ease;
    }
    .btn-upload:hover { background: var(--accent-dim); }
    .btn-upload:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    /* ── Library ── */
    main { padding: var(--space-5); max-width: 760px; margin: 0 auto; }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: var(--space-4);
    }

    .track-list { list-style: none; }

    .track-row {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 120ms ease;
    }
    .track-row:hover  { background: var(--surface-hover); }
    .track-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .track-row.playing { background: var(--surface-hover); }
    .track-row.playing .track-title { color: var(--accent); }

    .track-num {
      flex-shrink: 0;
      width: 22px;
      text-align: right;
      font-size: 13px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }
    .track-row.playing .track-num { display: none; }
    .track-icon-playing {
      display: none;
      flex-shrink: 0;
      width: 22px;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }
    .track-row.playing .track-icon-playing { display: flex; }

    .track-info { flex: 1; min-width: 0; }
    .track-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }
    .track-meta {
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-dur {
      flex-shrink: 0;
      font-size: 12px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .empty-state {
      text-align: center;
      padding: 48px var(--space-5);
      color: var(--text-muted);
    }
    .empty-state p { margin-top: var(--space-2); font-size: 14px; }
    .btn-upload-empty {
      margin-top: var(--space-4);
      padding: var(--space-2) var(--space-5);
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 150ms ease;
    }
    .btn-upload-empty:hover { background: var(--accent-dim); }
    .btn-upload-empty:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    /* ── Player bar ── */
    #player-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      z-index: 10;
      display: flex;
      flex-direction: column;
    }
    #player-bar.hidden { display: none; }

    /* Progress bar */
    .progress-wrap {
      position: relative;
      width: 100%;
      height: 4px;
      background: var(--range-track);
      cursor: pointer;
      transition: height 100ms ease;
    }
    .progress-wrap:hover { height: 6px; }
    .progress-fill {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 0%;
      background: var(--accent);
      pointer-events: none;
    }

    /* Three-column grid: track info | controls | time+volume */
    .player-main {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: var(--space-4);
      padding: var(--space-2) var(--space-5);
      height: 80px;
    }

    .player-track { min-width: 0; }
    .player-title {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-artist {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: var(--space-1);
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 120ms ease, background 120ms ease;
      padding: 0;
      flex-shrink: 0;
    }
    .ctrl-btn:hover  { color: var(--text); background: var(--surface-hover); }
    .ctrl-btn.active { color: var(--accent); }
    .ctrl-btn:focus-visible { outline: 2px solid var(--accent); }

    .ctrl-btn.primary {
      background: var(--accent);
      color: #fff;
      width: 42px;
      height: 42px;
    }
    .ctrl-btn.primary:hover { background: var(--accent-dim); color: #fff; }

    .player-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: var(--space-3);
    }

    .player-time {
      font-size: 11px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .player-volume {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      color: var(--text-muted);
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 2px;
      background: var(--range-track);
      cursor: pointer;
      outline: none;
    }
    input[type="range"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--accent);
    }
    input[type="range"]::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
    }

    #volume-slider { width: 76px; }

    /* ── Upload modal ── */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-backdrop.hidden { display: none; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: var(--space-5);
      width: min(420px, calc(100vw - 2 * var(--space-5)));
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-5);
    }
    .modal-header h2 { font-size: 16px; font-weight: 600; }

    .btn-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      padding: var(--space-1);
      border-radius: 4px;
    }
    .btn-close:hover { color: var(--text); background: var(--surface-hover); }
    .btn-close:focus-visible { outline: 2px solid var(--accent); }

    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 40px var(--space-5);
      text-align: center;
      color: var(--text-muted);
      cursor: pointer;
      transition: border-color 150ms ease, background 150ms ease;
      position: relative;
    }
    .drop-zone.dragover {
      border-color: var(--accent);
      background: var(--accent-glow);
      color: var(--text);
    }
    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }
    .drop-zone .drop-icon { font-size: 40px; margin-bottom: var(--space-3); }
    .drop-zone p { font-size: 14px; pointer-events: none; color: var(--text); }
    .drop-zone small { font-size: 12px; color: var(--text-muted); pointer-events: none; }

    .upload-status {
      margin-top: var(--space-4);
      font-size: 13px;
      min-height: 20px;
    }
    .upload-status.error   { color: var(--error); }
    .upload-status.success { color: var(--success); }
  </style>
</head>
<body>

<header>
  <span class="logo"><span>Mad</span>share</span>
  <div class="header-actions">
    <div class="theme-switcher" role="group" aria-label="Color theme">
      <button class="theme-dot active" data-theme="dark"   title="Dark"   aria-label="Dark theme"   aria-pressed="true"></button>
      <button class="theme-dot"        data-theme="light"  title="Light"  aria-label="Light theme"  aria-pressed="false"></button>
      <button class="theme-dot"        data-theme="ocean"  title="Ocean"  aria-label="Ocean theme"  aria-pressed="false"></button>
      <button class="theme-dot"        data-theme="sunset" title="Sunset" aria-label="Sunset theme" aria-pressed="false"></button>
    </div>
    <button class="btn-upload" id="openUpload" aria-haspopup="dialog">&#x2B; Upload</button>
  </div>
</header>

<main>
  <p class="section-title">Library</p>
  <ul class="track-list" id="trackList" role="list" aria-label="Music library">
    <li class="empty-state" id="emptyState">
      <span style="font-size:40px">&#9835;</span>
      <p>No tracks yet.</p>
      <button class="btn-upload-empty" id="openUploadEmpty">Upload your first file</button>
    </li>
  </ul>
</main>

<!-- Player bar -->
<div id="player-bar" class="hidden" aria-label="Now playing">
  <div class="progress-wrap" id="progressBar" role="slider"
       aria-label="Playback position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"
       tabindex="0">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div class="player-main">
    <div class="player-track">
      <div class="player-title"  id="playerTitle">—</div>
      <div class="player-artist" id="playerArtist"></div>
    </div>

    <div class="player-controls">
      <button class="ctrl-btn" id="btnShuffle" aria-label="Shuffle off" title="Shuffle off">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
        </svg>
      </button>
      <button class="ctrl-btn" id="btnPrev" aria-label="Previous" title="Previous">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>
        </svg>
      </button>
      <button class="ctrl-btn primary" id="btnPlay" aria-label="Play" title="Play">
        <svg id="iconPlay"  width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <svg id="iconPause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button class="ctrl-btn" id="btnNext" aria-label="Next" title="Next">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
        </svg>
      </button>
    </div>

    <div class="player-right">
      <span class="player-time" id="playerTime" aria-live="off">0:00 / 0:00</span>
      <div class="player-volume">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
        <input type="range" id="volume-slider" min="0" max="1" step="0.02" value="1" aria-label="Volume">
      </div>
    </div>
  </div>
</div>

<!-- Upload modal -->
<div class="modal-backdrop hidden" id="uploadModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Upload Music</h2>
      <button class="btn-close" id="closeModal" aria-label="Close">&times;</button>
    </div>
    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept="audio/*" aria-label="Choose audio file">
      <div class="drop-icon">&#9835;</div>
      <p>Drop an audio file here</p>
      <small>or click to browse &mdash; MP3, FLAC, OGG, WAV</small>
    </div>
    <div class="upload-status" id="uploadStatus" aria-live="polite"></div>
  </div>
</div>

<audio id="audio" preload="auto"></audio>

<script type="module">
  const API = 'http://localhost:3000';

  // ── Theme ─────────────────────────────────────────────────────────────────

  const html      = document.documentElement;
  const themeDots = document.querySelectorAll('.theme-dot');

  applyTheme(localStorage.getItem('madshare-theme') || 'dark');

  themeDots.forEach(dot => dot.addEventListener('click', () => applyTheme(dot.dataset.theme)));

  function applyTheme(name) {
    html.dataset.theme = name;
    localStorage.setItem('madshare-theme', name);
    themeDots.forEach(d => {
      const on = d.dataset.theme === name;
      d.classList.toggle('active', on);
      d.setAttribute('aria-pressed', String(on));
    });
  }

  // ── Library ──────────────────────────────────────────────────────────────

  let playlist = [];

  async function loadLibrary() {
    let tracks;
    try {
      const res = await fetch(`${API}/api/files`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      tracks = await res.json();
    } catch (err) {
      console.error('Failed to load library:', err);
      return;
    }

    const list  = document.getElementById('trackList');
    const empty = document.getElementById('emptyState');

    if (!tracks || tracks.length === 0) return;

    empty.remove();
    playlist = [];

    tracks.forEach((t, i) => {
      const title  = t.title  || t.filename;
      const artist = t.artist || '';
      const meta   = [artist, t.album, t.year || null].filter(Boolean).join(' · ');
      const dur    = t.duration ? fmtTime(t.duration) : '—';

      playlist.push({ url: `${API}${t.url}`, title, artist });

      const li = document.createElement('li');
      li.className = 'track-row';
      li.tabIndex  = 0;
      li.dataset.idx = i;
      li.setAttribute('role', 'button');
      li.setAttribute('aria-label', `Play ${title}`);
      li.innerHTML = `
        <span class="track-num">${i + 1}</span>
        <span class="track-icon-playing" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </span>
        <div class="track-info">
          <div class="track-title">${esc(title)}</div>
          <div class="track-meta">${esc(meta)}</div>
        </div>
        <span class="track-dur">${esc(dur)}</span>
      `;
      li.addEventListener('click', () => playIndex(i));
      li.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); playIndex(i); }
      });
      list.appendChild(li);
    });
  }

  // ── Player ───────────────────────────────────────────────────────────────

  let currentIndex = -1;
  let stopped      = false;
  let shuffle      = false;

  const audio        = document.getElementById('audio');
  const playerBar    = document.getElementById('player-bar');
  const playerTitle  = document.getElementById('playerTitle');
  const playerArtist = document.getElementById('playerArtist');
  const playerTime   = document.getElementById('playerTime');
  const progressBar  = document.getElementById('progressBar');
  const progressFill = document.getElementById('progressFill');
  const btnPlay      = document.getElementById('btnPlay');
  const btnShuffle   = document.getElementById('btnShuffle');
  const iconPlay     = document.getElementById('iconPlay');
  const iconPause    = document.getElementById('iconPause');
  const volumeSlider = document.getElementById('volume-slider');

  function playIndex(idx) {
    if (idx < 0 || idx >= playlist.length) return;
    currentIndex = idx;
    stopped      = false;

    const track = playlist[idx];
    audio.src = track.url;
    audio.play().catch(() => {});

    playerTitle.textContent  = track.title;
    playerArtist.textContent = track.artist;
    playerBar.classList.remove('hidden');

    document.querySelectorAll('.track-row').forEach((row, i) => {
      row.classList.toggle('playing', i === idx);
    });
  }

  document.getElementById('btnPrev').addEventListener('click', () => {
    const prev = currentIndex > 0 ? currentIndex - 1 : playlist.length - 1;
    playIndex(prev);
  });

  document.getElementById('btnNext').addEventListener('click', () => {
    const next = currentIndex < playlist.length - 1 ? currentIndex + 1 : 0;
    playIndex(next);
  });

  btnPlay.addEventListener('click', () => {
    if (stopped && currentIndex >= 0) { playIndex(currentIndex); return; }
    if (audio.paused) audio.play().catch(() => {});
    else              audio.pause();
  });

  btnShuffle.addEventListener('click', () => {
    shuffle = !shuffle;
    btnShuffle.classList.toggle('active', shuffle);
    const label = shuffle ? 'Shuffle on' : 'Shuffle off';
    btnShuffle.setAttribute('aria-label', label);
    btnShuffle.title = label;
  });

  audio.addEventListener('play',  syncPlayIcon);
  audio.addEventListener('pause', syncPlayIcon);
  audio.addEventListener('ended', () => {
    if (shuffle && playlist.length > 1) {
      let next;
      do { next = Math.floor(Math.random() * playlist.length); } while (next === currentIndex);
      playIndex(next);
    } else if (currentIndex < playlist.length - 1) {
      playIndex(currentIndex + 1);
    } else {
      stopped = true;
      syncPlayIcon();
    }
  });

  function syncPlayIcon() {
    const playing = !audio.paused && !stopped;
    iconPlay.style.display  = playing ? 'none' : '';
    iconPause.style.display = playing ? ''     : 'none';
    btnPlay.setAttribute('aria-label', playing ? 'Pause' : 'Play');
    btnPlay.title = playing ? 'Pause' : 'Play';
  }

  // Progress
  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    progressFill.style.width = pct + '%';
    progressBar.setAttribute('aria-valuenow', Math.round(pct));
    playerTime.textContent = fmtTime(audio.currentTime) + ' / ' + fmtTime(audio.duration);
  });

  progressBar.addEventListener('click', e => {
    if (!audio.duration) return;
    const r = progressBar.getBoundingClientRect();
    audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
  });

  progressBar.addEventListener('keydown', e => {
    if (!audio.duration) return;
    if (e.key === 'ArrowRight') audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
    if (e.key === 'ArrowLeft')  audio.currentTime = Math.max(0, audio.currentTime - 5);
  });

  // Volume
  volumeSlider.addEventListener('input', () => { audio.volume = volumeSlider.value; });

  function fmtTime(s) {
    if (!isFinite(s)) return '0:00';
    return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  }

  // ── Upload modal ─────────────────────────────────────────────────────────

  const modal     = document.getElementById('uploadModal');
  const dropZone  = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const status    = document.getElementById('uploadStatus');

  document.getElementById('openUpload').addEventListener('click', openModal);
  document.getElementById('openUploadEmpty')?.addEventListener('click', openModal);
  document.getElementById('closeModal').addEventListener('click', closeModal);
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  function openModal()  { modal.classList.remove('hidden'); fileInput.focus(); }
  function closeModal() { modal.classList.add('hidden'); setStatus('', ''); }

  dropZone.addEventListener('dragover',  e  => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file) uploadFile(file);
  });

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (file) uploadFile(file);
    fileInput.value = '';
  });

  async function uploadFile(file) {
    setStatus('Uploading "' + file.name + '"…', '');
    const fd = new FormData();
    fd.append('file', file);

    let data;
    try {
      const res = await fetch(`${API}/files/upload`, { method: 'POST', body: fd });
      if (!res.ok) {
        const msg = await res.text().catch(() => res.statusText);
        setStatus('Upload failed: ' + msg, 'error');
        return;
      }
      data = await res.json();
    } catch (err) {
      setStatus('Upload error: ' + err.message, 'error');
      return;
    }

    setStatus((data.existed ? 'Already in library' : 'Uploaded') + ': ' + file.name, 'success');
    document.getElementById('trackList').innerHTML = '';
    playlist = [];
    await loadLibrary();
  }

  function setStatus(msg, type) {
    status.textContent = msg;
    status.className   = 'upload-status' + (type ? ' ' + type : '');
  }

  // ── Utilities ────────────────────────────────────────────────────────────

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // ── Boot ─────────────────────────────────────────────────────────────────
  loadLibrary();
</script>
</body>
</html>
