<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upload &middot; Madshare</title>
  <meta name="api-url" content="{{.APIURL}}">
  {{template "theme-guard" .}}
  <!-- app.css carries the shared design tokens (:root[data-theme]) plus the
       header / nav styles this page reuses; upload.css adds the page-specific
       layout on top. Each webui page links its own CSS, so the tokens must come
       from app.css here too. -->
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/upload.css">
  <link rel="stylesheet" href="/static/css/file-view.css">
  <link rel="stylesheet" href="/static/css/player.css">
</head>
<body class="upload-page" data-page="upload" data-module="/static/js/upload.js">

{{template "header" .}}

<main class="upload-main">{{template "upload-main" .}}</main>

{{template "player-bar" .}}
{{template "auth-modals" .}}

<script type="module" src="/static/js/shell.js"></script>
</body>
</html>
