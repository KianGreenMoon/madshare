# Madshare reverse proxy — public deployment with TLS.
#
# Terminates HTTPS at nginx and proxies to the Madshare process, which is
# expected to listen on a loopback socket (see madshare.toml [[listen]]):
#
#   [[listen]]
#   addr  = "127.0.0.1"
#   port  = 3000
#   serve = ["api", "webui", "admin"]
#
# Adjust server_name, certificate paths and the upstream port to taste.

upstream madshare {
    server 127.0.0.1:3000;
}

# Redirect all plain HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name madshare.example.com;

    # Allow ACME (Let's Encrypt) HTTP-01 challenges to pass through.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name madshare.example.com;

    ssl_certificate     /etc/letsencrypt/live/madshare.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/madshare.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Must be >= storage.max_upload_mb in madshare.toml (default 500). Set to 0
    # to disable nginx's own limit and let the app enforce the cap instead.
    client_max_body_size 600m;

    location / {
        proxy_pass http://madshare;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Stream large uploads to the backend instead of buffering them in nginx.
        proxy_request_buffering off;

        # Audio streaming: don't buffer responses, and forward Range requests so
        # clients can seek. Long timeouts cover slow uploads and long streams.
        proxy_buffering    off;
        proxy_set_header   Range $http_range;
        proxy_set_header   If-Range $http_if_range;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
