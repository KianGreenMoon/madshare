# Madshare reverse proxy — public deployment with TLS.
#
# Terminates HTTPS at nginx and proxies to the Madshare process, which is
# expected to listen on a loopback socket (see madshare.toml [[listen]]):
#
#   [[listen]]
#   addr  = "127.0.0.1"
#   port  = 3000
#   serve = ["api", "webui", "admin"]
#
# Adjust server_name, certificate paths and the upstream port to taste.

# Per-client rate-limit zone for the login endpoint, keyed on the REAL client IP
# as nginx sees it ($binary_remote_addr). This is the right layer to throttle
# logins when Madshare runs behind a proxy: the app has its own per-IP login
# throttle, but it deliberately EXEMPTS loopback peers — behind a proxy every
# remote client arrives from nginx's loopback address, and throttling that one
# address would lock out all users at once. So the app leaves per-client login
# limiting to nginx here, which sees the true remote IP. (The app's global cap
# on *concurrent* password verifications still applies behind the proxy; only
# the per-IP budget is delegated.) Must live in http{} context — these files
# are included there. If you include BOTH example files at once, rename the zone
# in one of them so the names don't collide.
limit_req_zone $binary_remote_addr zone=madshare_login:10m rate=10r/m;

upstream madshare {
    server 127.0.0.1:3000;
}

# Redirect all plain HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name madshare.example.com;

    # Allow ACME (Let's Encrypt) HTTP-01 challenges to pass through.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name madshare.example.com;

    ssl_certificate     /etc/letsencrypt/live/madshare.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/madshare.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Must be >= storage.max_upload_mb in madshare.toml (default 500). Set to 0
    # to disable nginx's own limit and let the app enforce the cap instead.
    client_max_body_size 600m;

    # --- Shared proxy behavior, set at server scope so every location below
    # inherits it. NOTE: a location that sets its OWN proxy_set_header stops
    # inheriting *all* of these, so the locations below add only proxy_pass. ---

    # Pass the original host and client details through to the app (it reads
    # X-Forwarded-Proto to mark the session cookie Secure behind TLS).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Stream large uploads to the backend instead of buffering them in nginx.
    proxy_request_buffering off;

    # Audio streaming: don't buffer responses, and forward Range requests so
    # clients can seek. Long timeouts cover slow uploads and long streams.
    proxy_buffering    off;
    proxy_set_header   Range    $http_range;
    proxy_set_header   If-Range $http_if_range;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # send_timeout is the CLIENT-facing one, and it is the whole reason a stream
    # dies at 60 s: the two directives above govern nginx <-> madshare, while this
    # governs nginx <-> browser. It fires between successive writes to the client,
    # so a media element that PAUSES — stops draining its socket while the buffer
    # stays full — trips the default 60 s and nginx closes the connection. The
    # browser sees a clean EOF against a full Content-Length, i.e. a silently
    # truncated track with nothing logged on either side. Measured: 45 s idle
    # completes, 70 s and 90 s truncate; the same stream over the direct mesh
    # route (no proxy) completes.
    send_timeout 3600s;

    # Throttle the unauthenticated, deliberately expensive login endpoint per
    # real client IP (see the limit_req_zone note above). burst=10 absorbs a
    # short spike, nodelay serves it immediately, then excess gets a 429.
    # Mirrors the app's own ~10/min budget — the layer that actually sees the
    # true client when proxied.
    location = /api/auth/login {
        limit_req        zone=madshare_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass       http://madshare;
    }

    # Everything else: inherits the shared proxy settings above.
    location / {
        proxy_pass http://madshare;
    }
}
