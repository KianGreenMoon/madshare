# Madshare reverse proxy — plain HTTP over the Yggdrasil network.
#
# Yggdrasil already provides end-to-end encryption at the network layer, so
# TLS at nginx is redundant here: peers reach this node over its Yggdrasil
# IPv6 address (the 0200::/7 range) and the traffic is encrypted in transit
# by Yggdrasil itself. This vhost therefore listens on plain HTTP, bound to
# the node's Yggdrasil address only — it is NOT exposed to the public internet.
#
# As with the TLS config, Madshare is expected to listen on loopback:
#
#   [[listen]]
#   addr  = "127.0.0.1"
#   port  = 3000
#   serve = ["api", "webui", "admin"]

# Per-client rate-limit zone for the login endpoint, keyed on the REAL peer
# address as nginx sees it (here, the caller's Yggdrasil IPv6). The app's own
# per-IP login throttle keys on the TCP peer, which is always nginx's loopback
# address when proxied — so to the app every peer looks like one client. nginx
# sees the true peer and can throttle per actual caller. (The app's global cap
# on concurrent password verifications still applies.) Must live in http{}
# context. If you include both example files at once, rename this zone in one.
limit_req_zone $binary_remote_addr zone=madshare_login:10m rate=10r/m;

upstream madshare {
    server 127.0.0.1:3000;
}

server {
    # Replace with this node's Yggdrasil address. Binding to the specific
    # address keeps the service off any other (e.g. public) interface.
    listen [201:abcd:1234:5678:9abc:def0:1234:5678]:80;

    # Yggdrasil addresses have no DNS by default; match the literal address,
    # or use a .ygg name if you run a resolver (e.g. via Alfis / a hosts file).
    server_name _;

    # Must be >= storage.max_upload_mb in madshare.toml (default 500).
    client_max_body_size 600m;

    # --- Shared proxy behavior, set at server scope so every location below
    # inherits it. A location that sets its own proxy_set_header stops
    # inheriting these, so the locations below add only proxy_pass. ---
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # Traffic is plaintext between peer and nginx, but Yggdrasil encrypts the
    # underlying link, so advertise the effective scheme as http.
    proxy_set_header X-Forwarded-Proto http;

    proxy_request_buffering off;

    proxy_buffering    off;
    proxy_set_header   Range    $http_range;
    proxy_set_header   If-Range $http_if_range;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Throttle the expensive, unauthenticated login endpoint per real peer
    # address (the layer that actually sees the true caller when proxied).
    location = /api/auth/login {
        limit_req        zone=madshare_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass       http://madshare;
    }

    # Everything else: inherits the shared proxy settings above.
    location / {
        proxy_pass http://madshare;
    }
}
